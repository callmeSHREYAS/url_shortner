version: "3.9"

services:
  mysql:
    image: mysql:latest
    container_name: mysql-url-shortner

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: myrootpassword
      MYSQL_DATABASE: url_db

    ports:
      - "3306:3306"

    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pmyrootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis-url-shortner
    restart: always

    ports:
      - "6379:6379"

  mysql-replica:
    image: mysql:latest
    container_name: mysql-url-shortner-replica

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: myrootpassword
      MYSQL_DATABASE: url_db

    ports:
      - "3307:3306"

    command:
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --read-only=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

    volumes:
      - mysql-replica-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pmyrootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-replication-init:
    image: mysql:latest
    container_name: mysql-replication-init
    depends_on:
      mysql:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: myrootpassword
      REPLICATION_PASSWORD: replicationpassword
    volumes:
      - ./docker/mysql/configure-replication.sh:/configure-replication.sh:ro
    entrypoint: [ "sh", "/configure-replication.sh" ]

  app1:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortner-1

    restart: always

    depends_on:
      mysql:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      mysql-replication-init:
        condition: service_completed_successfully

    expose:
      - "8081"

    environment:
      SERVER_PORT: 8081
      INSTANCE_NAME: APP-1
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:mysql://mysql:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_REPLICA_URL: jdbc:mysql://mysql-replica:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PRIMARY_USERNAME: root
      SPRING_DATASOURCE_PRIMARY_PASSWORD: myrootpassword
      SPRING_DATASOURCE_REPLICA_USERNAME: root
      SPRING_DATASOURCE_REPLICA_PASSWORD: myrootpassword

  app2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortner-2

    restart: always

    depends_on:
      mysql:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
      mysql-replication-init:
        condition: service_completed_successfully

    expose:
      - "8081"

    environment:
      SERVER_PORT: 8081
      INSTANCE_NAME: APP-2
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:mysql://mysql:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_REPLICA_URL: jdbc:mysql://mysql-replica:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PRIMARY_USERNAME: root
      SPRING_DATASOURCE_PRIMARY_PASSWORD: myrootpassword
      SPRING_DATASOURCE_REPLICA_USERNAME: root
      SPRING_DATASOURCE_REPLICA_PASSWORD: myrootpassword


  app3:
