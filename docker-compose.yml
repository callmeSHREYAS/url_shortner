      SPRING_DATASOURCE_REPLICA_URL: jdbc:mysql://mysql-replica:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_PRIMARY_USERNAME: root
      SPRING_DATASOURCE_PRIMARY_PASSWORD: myrootpassword
      SPRING_DATASOURCE_REPLICA_USERNAME: root
      SPRING_DATASOURCE_REPLICA_PASSWORD: myrootpassword



  nginx:
    image: nginx:latest

    container_name: nginx-load-balancer

    ports:
      - "8081:8081"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app1
      - app2
      - app3
      - app4
      - app5
      
  zookeeper1:
    image: zookeeper:3.9
    container_name: zookeeper-1

    restart: always

    volumes:
      - zookeeper1-data:/data
      - zookeeper1-datalog:/datalog

    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181

  zookeeper2:
    image: zookeeper:3.9
    container_name: zookeeper-2

    restart: always

    volumes:
      - zookeeper2-data:/data
      - zookeeper2-datalog:/datalog

    environment:
