version: "3.9"

services:
  mysql:
    image: mysql:latest
    container_name: mysql-url-shortner

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: myrootpassword
      MYSQL_DATABASE: url_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pmyrootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis-url-shortner
    restart: always

    ports:
      - "6379:6379"

  app1:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortner-1

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "8081"

    environment:
      SERVER_PORT: 8081
      INSTANCE_NAME: APP-1
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: myrootpassword

  app2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortner-2

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "8081"

    environment:
      SERVER_PORT: 8081
      INSTANCE_NAME: APP-2
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: myrootpassword


  app3:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortner-3

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "8081"

    environment:
      SERVER_PORT: 8081
      INSTANCE_NAME: APP-3
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: myrootpassword

  app4:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortner-4

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "8081"

    environment:
      SERVER_PORT: 8081
      INSTANCE_NAME: APP-4
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: myrootpassword

  app5:
    build:
      context: .
      dockerfile: Dockerfile
  
    container_name: url-shortner-5

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "8081"

    environment:
      SERVER_PORT: 8081
      INSTANCE_NAME: APP-5
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/url_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: myrootpassword



  nginx:
    image: nginx:latest

    container_name: nginx-load-balancer

    ports:
      - "8081:8081"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - app1
      - app2
      - app3
      - app4
      - app5
      
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper

    restart: always

    ports:
      - "2181:2181"

    environment:
      ZOO_MY_ID: 1


volumes:
  mysql-data:
