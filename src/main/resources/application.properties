spring.application.name=url_shortner

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/url_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=myrootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8081

spring.data.redis.host=redis
spring.data.redis.port=6379

# Async click-event worker settings
click-events.batch-size=100
click-events.poll-delay-ms=100
click-events.read-block-ms=100
click-events.claim-idle-ms=30000

# Create endpoint: 10 requests per client IP per 60-second window
rate-limit.create.max-requests=10
rate-limit.create.window-seconds=60

zookeeper.connect-string=zookeeper:2181
