spring.application.name=url_shortner

# MySQL Connection Settings
spring.datasource.primary.url=${PRIMARY_DB_URL:jdbc:mysql://localhost:3306/url_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.primary.username=${PRIMARY_DB_USERNAME:root}
spring.datasource.primary.password=${PRIMARY_DB_PASSWORD:myrootpassword}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.replica.url=${REPLICA_DB_URL:jdbc:mysql://localhost:3307/url_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.replica.username=${REPLICA_DB_USERNAME:root}
spring.datasource.replica.password=${REPLICA_DB_PASSWORD:myrootpassword}
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8081

spring.data.redis.host=redis
spring.data.redis.port=6379

# Async click-event worker settings
click-events.batch-size=100
click-events.poll-delay-ms=100
click-events.read-block-ms=100
click-events.claim-idle-ms=30000

# Create endpoint: 10 requests per client IP per 60-second window
rate-limit.create.max-requests=10
rate-limit.create.window-seconds=60

zookeeper.connect-string=${ZOOKEEPER_CONNECT_STRING:zookeeper1:2181,zookeeper2:2181,zookeeper3:2181}
